// Файл android/build.gradle

buildscript {
    repositories {
        google()
        mavenCentral()
        maven { url = uri("https://www.jitpack.io") }
    }
    dependencies {
        // Обновление AGP
        classpath 'com.android.tools.build:gradle:8.6.0'  // Обновить до версии 8.6.0
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.8.0'  // Проверьте актуальность Kotlin
        classpath 'com.google.gms:google-services:4.3.14'
    }
}


allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url = uri("https://www.jitpack.io") }
    }
}

rootProject.buildDir = "../build"

subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}

subprojects {
    project.evaluationDependsOn(":app")
}

// Задача для очистки проекта
tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
