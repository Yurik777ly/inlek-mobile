plugins {
    id "com.android.application"
    // START: FlutterFire Configuration
    id 'com.google.gms.google-services'
    // END: FlutterFire Configuration
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

android {
    namespace "com.dkmfarm.inlek.app"
    compileSdk 36
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8

        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    // Чтение первого файла с ключами
    def releaseKeystoreProperties = new Properties()
    def releaseKeystorePropertiesFile = rootProject.file("key_upload.properties")
    def hasReleaseKeystore = releaseKeystorePropertiesFile.exists()
    if (hasReleaseKeystore) {
        releaseKeystoreProperties.load(new FileInputStream(releaseKeystorePropertiesFile))
    }

    // Чтение второго файла с ключами
    def debugKeystoreProperties = new Properties()
    def debugKeystorePropertiesFile = rootProject.file("key_debug.properties")
    if (debugKeystorePropertiesFile.exists()) {
        debugKeystoreProperties.load(new FileInputStream(debugKeystorePropertiesFile))
    }

     defaultConfig {
        applicationId = "com.dkmfarm.inlek.app"
        minSdkVersion 26
        targetSdkVersion 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        multiDexEnabled true

        // Google Pay configuration
        //manifestPlaceholders = [
        //    'stripe_google_pay_enabled': 'true',
        //    'stripe_google_pay_mode': 'test' // Change to 'production' for live
        //]
    }

    signingConfigs {
        release {
            if (hasReleaseKeystore) {
                def storeFilePath = releaseKeystoreProperties['storeFile']
                if (storeFilePath == null || storeFilePath.toString().trim().isEmpty()) {
                    throw new GradleException("key_upload.properties: storeFile is not set")
                }

                def keystoreFile = rootProject.file(storeFilePath)
                if (!keystoreFile.exists()) {
                    throw new GradleException(
                        "Release keystore not found: ${keystoreFile.absolutePath}. " +
                        "Check storeFile path in android/key_upload.properties"
                    )
                }

                storeFile keystoreFile
                keyAlias releaseKeystoreProperties['keyAlias']
                keyPassword releaseKeystoreProperties['keyPassword']
                storePassword releaseKeystoreProperties['storePassword']
            }
        }
        debug {
//            storeFile file(debugKeystoreProperties['storeFile'])
//            keyAlias debugKeystoreProperties['keyAlias']
//            keyPassword debugKeystoreProperties['keyPassword']
//            storePassword debugKeystoreProperties['storePassword']
        }
    }
    
    buildTypes {
        release {
            if (!hasReleaseKeystore) {
                throw new GradleException(
                    "Release signing is not configured. Create android/key_upload.properties " +
                    "(see https://docs.flutter.dev/deployment/android#signing-the-app). " +
                    "Keystore file upload-keystore.jks is in the project root."
                )
            }
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
            minifyEnabled true
            shrinkResources true
        }
        debug {
            signingConfig signingConfigs.debug
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }

    buildFeatures {
       dataBinding = true
   }
}

flutter {
    source = "../.."
}

dependencies {
    implementation 'com.yandex.android:maps.mobile:4.4.0-lite'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
}
